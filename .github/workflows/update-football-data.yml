name: Update Football Data (Understat)

on:
  schedule:
    # Domingos por la noche (23:30 UTC): tras finalizar el grueso de partidos del fin de semana
    - cron: '30 23 * * 0'
    # Lunes por la noche (23:00 UTC): tras el partido de cierre de jornada de LaLiga
    - cron: '0 23 * * 1'
    # Martes y Miércoles por la noche (23:00 UTC): tras jornadas de Champions League e intersemanales
    - cron: '0 23 * * 2,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Update Pipeline
        run: |
          python backend/update_pipeline.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/data/ backend/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything up to date."
          else
            git commit -m "chore(data): auto-update matchweek stats"
            git push
          fi
