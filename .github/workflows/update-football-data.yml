name: Update Football Data (Understat)

on:
  schedule:
    # Runs automatically every Monday and Friday at 06:00 UTC
    - cron: '0 6 * * 1,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Update Pipeline
        run: |
          python backend/update_pipeline.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/data/ backend/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything up to date."
          else
            git commit -m "chore(data): auto-update matchweek stats"
            git push
          fi
